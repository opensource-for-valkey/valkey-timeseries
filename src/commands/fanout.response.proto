syntax = "proto3";

package valkey_timeseries.fanout;

// ---------------------------------------------------------------------------
// Shared primitives
// ---------------------------------------------------------------------------

message Label {
  string name = 1;
  string value = 2;
}

message Sample {
  int64 timestamp = 1;
  double value = 2;
}

enum CompressionType {
  COMPRESSION_TYPE_UNSPECIFIED = 0;
  COMPRESSION_TYPE_UNCOMPRESSED = 1;
  COMPRESSION_TYPE_GORILLA = 2;
  COMPRESSION_TYPE_CHIMP = 3;
}

message SampleData {
  uint32 version = 1;
  CompressionType compression = 2;
  bytes data = 3;
}

// MGetValue carries a single-key response for TS.MGET fanout.
message MGetValue {
  string key = 1;
  Sample sample = 2;
  repeated Label labels = 3;
}

// SeriesRangeResponse carries per-series data for TS.MRANGE fanout.
message SeriesRangeResponse {
  string key = 1;
  string group_label_value = 2;
  repeated Label labels = 3;
  // One chunk of (bucket_ts, value) pairs per aggregation column. Raw samples
  // and single-aggregation buckets are a one-element list; multi-aggregation
  // buckets carry one column per aggregator (>= 2 columns). An empty
  // multi-aggregation series carries zero columns. All columns share identical
  // timestamps and length by construction.
  repeated SampleData columns = 4;
}

// MultiGetResponse carries the aggregated TS.MGET results from a shard.
message MultiGetResponse {
  repeated MGetValue values = 1;
}

// CountResponse replaces the structurally-identical MDelResponse
// (uint64 deleted_count = 1) and CardinalityResponse (uint64 cardinality = 1).
// Wire bytes are unchanged; dispatch is by handler name.
message CountResponse {
  uint64 count = 1;
}

// Reducer state for one bucket; field meaning depends on the reducer type
// (carried in the request). count is the number of accepted (non-rejected)
// values; acc1/acc2 hold sums, extrema, the selected value, or (for the
// std/var family) the Welford running mean and M2; ts is the contributing
// sample timestamp for first/last.
message ReducePartialState {
  uint64 count = 1;
  double acc1 = 2;
  double acc2 = 3;
  int64 ts = 4;
  // Neumaier compensation for acc1 (sum/sumif/avg reducers). Absent decodes
  // as 0.0 — "a sum carrying no accumulated error" — which the compensated
  // merge handles exactly.
  double acc1_compensation = 5;
}

// One (group, shard) partial series, ascending timestamps. `states` is
// row-major: bucket i, aggregation column j is at states[i * column_count + j]
// (states.len() == bucket_timestamps.len() * column_count). Single-aggregation
// and no-AGGREGATION queries have column_count == 1; a multi-aggregation query
// has one column per aggregator, all reduced with the same REDUCE type.
message GroupPartialSeries {
  string group_label_value = 1;
  repeated string source_keys = 2;
  repeated int64 bucket_timestamps = 3;
  repeated ReducePartialState states = 4;
  uint32 column_count = 5;
}

// MultiRangeResponse carries the aggregated TS.MRANGE results from a shard.
message MultiRangeResponse {
  repeated SeriesRangeResponse series = 1;
  // Populated instead of `series` when the request set apply_group_reduce.
  repeated GroupPartialSeries group_partials = 2;
  // Compatibility handshake: the shard echoes which push-down request flags it honored. 
  // Absent on pre-handshake shards (proto3 decodes as false), which is exactly the
  // correct interpretation — nothing was applied and `series` carries raw
  // samples. The coordinator compensates per response, so mixed-version
  // clusters degrade gracefully instead of corrupting results.
  bool applied_aggregation = 3;
  bool applied_group_reduce = 4;
  bool applied_count = 5;
}

// StringListResponse replaces the structurally-identical IndexQueryResponse
// (repeated string keys = 1), LabelNamesResponse, and LabelValuesResponse.
// Wire bytes are unchanged; dispatch is by handler name.
message StringListResponse {
  repeated string values = 1;
}

// LabelSearchResult carries a single fuzzy-match hit.
message LabelSearchResult {
  string value = 1;
  double score = 2;
  uint64 cardinality = 3;
}

// LabelSearchResponse carries the aggregated label-search results from a shard.
message LabelSearchResponse {
  repeated LabelSearchResult results = 1;
  bool has_more = 2;
}

// PostingStat carries a single (name, count) pair used in StatsResponse.
message PostingStat {
  string name = 1;
  uint64 count = 2;
}

// StatsResponse carries the aggregated TS.LABELSTATS results from a shard.
message StatsResponse {
  uint64 series_count = 1;
  repeated PostingStat series_count_by_metric_name = 2;
  repeated PostingStat series_count_by_label_name = 3;
  repeated PostingStat series_count_by_label_value_pairs = 4;
  repeated PostingStat series_count_by_focus_label_value = 5;
  bytes labels_bitmap = 6;
  bytes label_value_pairs_bitmap = 7;
}
