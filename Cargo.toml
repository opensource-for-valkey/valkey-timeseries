[package]
name = "valkey-timeseries"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
readme = "README.md"
repository = "https://github.com/ccollie/valkey-timeseries"
homepage = "https://github.com/ccollie/valkey-timeseries"
description = "A Timeseries data type for Valkey"

[dependencies]
ahash = { version = "0.8", features = ["std"] }
arc-swap = "1.9"
blart = "0.6"
bon = { version = "3.10.1", optional = true }
byte-pool = "0.2.4"
croaring = "2.8.0"
enquote = "1.1.0"
enum_dispatch = "0.3.13"
get-size2 = { version = "0.11.0", features = ["derive"] }
hashify = { version = "0.3" }
itertools = "0.15.0"
linkme = "0.3"
logos = "0.16"
# `persistent-pool-rayon`: run `.par()` on a dedicated rayon-core pool that orx builds lazily
# (the module's shared pool: `common::threads` sends `join` and the `*_rayon` adapters there too;
# sized to `ORX_NUM_THREADS` from `ts-num-threads`, capped at the core count). 4.0's default persistent pool blocks callers without helping, so the nested
# parallel iterators here (per-series inside per-query) could deadlock it once every worker
# waits on an inner scope; a rayon worker steals work while it waits, and threads are reused
# rather than spawned per call as with `transient-pool`. There is no plain `rayon` feature.
orx-parallel = { version = "4", features = ["persistent-pool-rayon"] }
min-max-heap = "1.3"
num-traits = "0.2"
krcf = "0.4"
papaya = "0.2"
prost = "0.14"
rand = { version = "0.10" }
rand_distr = { version = "0.6", optional = true }
smallvec = "1.16"
speedate = "0.17"
thiserror = "2.0"
valkey-module = "0.1.14"
valkey-module-macros = "0.1.14"
range-set-blaze = "0.7.0"
# Client for tools/fleet_loader only; never linked into the module.
redis = { version = "1.7", optional = true, default-features = false, features = ["cluster"] }
rayon-core = "1.13"
regex = "1"
simd-json = "0.18.1"
# Only `StudentsT` is used; the default features pull in nalgebra and rand for nothing.
statrs = { version = "0.19.1", default-features = false, features = ["std"] }
welch-sde = "0.1.0"
regex-syntax = "0.8.11"
crc16 = "0.4.0"

[dev-dependencies]
# Self-dependency so benches, tests and the compression_report bin all see the
# `test-utils` module (src/tests) without it leaking into the shipped module.
valkey-timeseries = { path = ".", features = ["test-utils"] }
criterion = { version = "0.8", features = ["html_reports"] }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
test-case = "3.3"
serial_test = { version = "4.0.1", default-features = false }
proptest = "1"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[lib]
name = "valkey_timeseries"
# Produce both a cdylib for embedding into Valkey and an rlib so the crate
# can be linked against by Rust integration tests and examples.
crate-type = ["cdylib", "rlib"]
bench = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "query_scan"
harness = false

[[bin]]
name = "compression_report"
path = "tools/compression_report.rs"
required-features = ["test-utils", "enable-system-alloc"]

[[bin]]
name = "latency_report"
path = "tools/latency_report.rs"
required-features = ["test-utils", "enable-system-alloc"]

[[bin]]
name = "wire_report"
path = "tools/wire_report.rs"
required-features = ["test-utils", "enable-system-alloc"]

[[bin]]
name = "interning_report"
path = "tools/interning_report.rs"
required-features = ["test-utils", "enable-system-alloc"]

[[bin]]
name = "fleet_loader"
path = "tools/fleet_loader.rs"
required-features = ["fleet-loader", "enable-system-alloc"]

[features]
default = ["min-valkey-compatibility-version-8-0", "croaring/alloc"]
enable-system-alloc = ["valkey-module/enable-system-alloc"]
min-valkey-compatibility-version-8-0 = ["valkey-module/min-valkey-compatibility-version-8-0"]
use-redismodule-api = [] # We don't support this feature flag which is why it is empty.
# Exposes src/tests (data generators, chunk helpers) to benchmarks and tools.
# Enabled automatically for dev targets via the self dev-dependency above.
# The generators in src/tests are the only users of these two.
test-utils = ["dep:bon", "dep:rand_distr"]
# tools/fleet_loader: the fleet generator plus a Valkey client to load it with.
fleet-loader = ["test-utils", "dep:redis"]
