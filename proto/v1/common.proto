syntax = "proto3";

package valkey_timeseries.fanout.v1;

message DateRange {
  int64 start = 1;
  int64 end = 2;
}

message MetaDateRangeFilter {
  int64 start = 1;
  int64 end = 2;
  bool exclude = 3;
}

message ValueRange {
  double min = 1;
  double max = 2;
}

enum AggregationType {
  AGGREGATION_TYPE_UNSPECIFIED = 0;
  AGGREGATION_TYPE_ALL = 1;
  AGGREGATION_TYPE_ANY = 2;
  AGGREGATION_TYPE_AVG = 3;
  AGGREGATION_TYPE_COUNT = 4;
  AGGREGATION_TYPE_COUNT_ALL = 5;
  AGGREGATION_TYPE_COUNT_IF = 6;
  AGGREGATION_TYPE_COUNT_NAN = 7;
  AGGREGATION_TYPE_FIRST = 8;
  AGGREGATION_TYPE_INCREASE = 9;
  AGGREGATION_TYPE_IRATE = 10;
  AGGREGATION_TYPE_LAST = 11;
  AGGREGATION_TYPE_MAX = 12;
  AGGREGATION_TYPE_MIN = 13;
  AGGREGATION_TYPE_NONE = 14;
  AGGREGATION_TYPE_SHARE_IF = 15;
  AGGREGATION_TYPE_SUM = 16;
  AGGREGATION_TYPE_SUM_IF = 17;
  AGGREGATION_TYPE_RANGE = 18;
  AGGREGATION_TYPE_RATE = 19;
  AGGREGATION_TYPE_STD_S = 20;
  AGGREGATION_TYPE_STD_P = 21;
  AGGREGATION_TYPE_VAR_S = 22;
  AGGREGATION_TYPE_VAR_P = 23;
}

enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_GT = 1;
  COMPARISON_OPERATOR_GTE = 2;
  COMPARISON_OPERATOR_LT = 3;
  COMPARISON_OPERATOR_LTE = 4;
  COMPARISON_OPERATOR_EQ = 5;
  COMPARISON_OPERATOR_NEQ = 6;
}

message ValueComparisonFilter {
  ComparisonOperator operator = 1;
  double value = 2;
}

message AggregatorConfig {
  AggregationType aggregator_type = 1;
  ValueComparisonFilter value_filter = 2;
}

message GroupingOptions {
  string group_label = 1;
  AggregatorConfig aggregation = 2;
}

enum BucketTimestampType {
  BUCKET_TIMESTAMP_TYPE_UNSPECIFIED = 0;
  BUCKET_TIMESTAMP_TYPE_START = 1;
  BUCKET_TIMESTAMP_TYPE_END = 2;
  BUCKET_TIMESTAMP_TYPE_MID = 3;
}

enum BucketAlignmentType {
  BUCKET_ALIGNMENT_TYPE_UNSPECIFIED = 0;
  BUCKET_ALIGNMENT_TYPE_DEFAULT = 1;
  BUCKET_ALIGNMENT_TYPE_ALIGN_START = 2;
  BUCKET_ALIGNMENT_TYPE_ALIGN_END = 3;
  BUCKET_ALIGNMENT_TYPE_TIMESTAMP = 4;
}

message AggregationOptions {
  repeated AggregatorConfig aggregators = 1;
  uint32 bucket_duration = 2;
  int64 alignment_timestamp = 3;
  BucketTimestampType bucket_timestamp_type = 4;
  BucketAlignmentType bucket_alignment = 5;
  bool report_empty = 6;
}

message Label {
  string name = 1;
  string value = 2;
}

message Sample {
  int64 timestamp = 1;
  double value = 2;
}

enum CompressionType {
  COMPRESSION_TYPE_UNSPECIFIED = 0;
  COMPRESSION_TYPE_UNCOMPRESSED = 1;
  COMPRESSION_TYPE_GORILLA = 2;
  COMPRESSION_TYPE_CHIMP = 3;
}

message SampleData {
  uint32 version = 1;
  CompressionType compression = 2;
  bytes data = 3;
}

message PostingStat {
  string name = 1;
  uint64 count = 2;
}