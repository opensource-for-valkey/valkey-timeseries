syntax = "proto3";

package valkey_timeseries.fanout.v1;

import "v1/common.proto";

message MGetValue {
  // Key names are binary-safe in Valkey (an interior NUL or a non-UTF-8 byte is
  // legal), so this is `bytes`, not `string`: proto3 `string` requires valid
  // UTF-8 and would force a lossy conversion that corrupts the name the client
  // sees. Same for every other key-name field below.
  bytes key = 1;
  Sample sample = 2;
  repeated Label labels = 3;
}

message SeriesRangeResponse {
  bytes key = 1;
  string group_label_value = 2;
  repeated Label labels = 3;
  repeated SampleData columns = 4;
  // Label storage, used in place of `labels`: parallel arrays, one entry per
  // label, indexing into `MultiRangeResponse.symbol_table_names` /
  // `symbol_table_values`. Interning is unconditional, so there is no
  // flag; non-empty ref arrays are themselves the signal.
  //
  // Both arrays empty means there is nothing to resolve — either the series has
  // no labels, or it carries them in `labels` directly. A decoder must leave
  // `labels` alone in that case rather than overwriting it.
  repeated uint32 label_name_refs = 5;
  repeated uint32 label_value_refs = 6;
}

message MultiGetResponse {
  repeated MGetValue values = 1;
}

message CountResponse {
  uint64 count = 1;
}

message ReducePartialState {
  uint64 count = 1;
  double acc1 = 2;
  double acc2 = 3;
  reserved 4;
  double acc1_compensation = 5;
}

message GroupPartialSeries {
  string group_label_value = 1;
  repeated bytes source_keys = 2;
  repeated int64 bucket_timestamps = 3;
  repeated ReducePartialState states = 4;
  uint32 column_count = 5;
}

message MultiRangeResponse {
  repeated SeriesRangeResponse series = 1;
  repeated GroupPartialSeries group_partials = 2;
  // Dictionaries `SeriesRangeResponse.label_name_refs`/`label_value_refs`
  // index into. Label interning is unconditional, so these are populated
  // whenever `series` carries any labels; empty otherwise.
  repeated string symbol_table_names = 3;
  repeated string symbol_table_values = 4;
}

// QUERYINDEX returns key names verbatim, including invalid UTF-8 and interior NULs.
message KeyListResponse {
  repeated bytes keys = 1;
}

// QUERYLABELS returns UTF-8 label names or values.
message StringListResponse {
  repeated string values = 1;
}

message LabelSearchResult {
  string value = 1;
  double score = 2;
  uint64 cardinality = 3;
}

message LabelSearchResponse {
  repeated LabelSearchResult results = 1;
  bool has_more = 2;
}

// How many of a shard's matching series carry one value of a label.
message ValueCount {
  string value = 1;
  uint64 count = 2;
}

// One label name's values among a shard's matching series.
message LabelValueCounts {
  string name = 1;
  repeated ValueCount values = 2;
}

// A shard's whole label census, untruncated: the coordinator sums the counts
// across shards and derives every section of TS.LABELSTATS from the result, so
// LIMIT applies to global counts and distinct totals are exact.
message StatsResponse {
  uint64 series_count = 1;
  repeated LabelValueCounts labels = 2;
}
// One bucket of a node's interning pool. `key` is the bucket's grouping value —
// the external reference count or the string length — and is unused for the
// pool-wide total.
message StringPoolBucket {
  uint64 key = 1;
  uint64 count = 2;
  uint64 bytes = 3;
  uint64 allocated = 4;
}

message StringPoolTopKEntry {
  string value = 1;
  uint64 ref_count = 2;
  uint64 bytes = 3;
  uint64 allocated = 4;
}

// A node's interning pool statistics. The percentages are not shipped: they
// are ratios, so the coordinator recomputes them from the summed byte counts.
message StringPoolStatsResponse {
  StringPoolBucket total = 1;
  repeated StringPoolBucket by_ref_count = 2;
  repeated StringPoolBucket by_size = 3;
  uint64 memory_saved_bytes = 4;
  uint64 holder_count = 5;
  uint64 holder_slot_bytes = 6;
  repeated StringPoolTopKEntry top_k_by_ref = 7;
  repeated StringPoolTopKEntry top_k_by_size = 8;
}

// A node's label-index heap footprint, in bytes, for one database or summed
// over all of them.
// `terms_bytes` and `id_to_key_bytes` omit the internal node overhead of the
// structures holding them, so the totals are a floor. The total is not shipped:
// the coordinator recomputes it from the summed parts.
message IndexMemoryResponse {
  uint64 db_count = 1;
  uint64 term_count = 2;
  uint64 series_count = 3;
  uint64 terms_bytes = 4;
  uint64 postings_bytes = 5;
  uint64 id_to_key_bytes = 6;
  uint64 bookkeeping_bytes = 7;
}

// A cumulative histogram: `bounds[i]` is bucket i's upper bound (the last one
// is +Inf) and `cumulative_counts[i]` the observations at or below it.
message DebugMetricHistogram {
  uint64 count = 1;
  double sum = 2;
  repeated double bounds = 3;
  repeated uint64 cumulative_counts = 4;
}

// One metric, by its sample name (a counter's ends in `_total`). The
// coordinator sums counters and histograms across nodes and lists gauges per
// node.
message DebugMetric {
  string name = 1;
  oneof value {
    uint64 counter = 2;
    sint64 gauge_int = 3;
    uint64 gauge_uint = 4;
    double gauge_float = 5;
    DebugMetricHistogram histogram = 6;
  }
}

// A node's metrics, counted from its own last METRICS RESET.
message DebugMetricsResponse {
  repeated DebugMetric metrics = 1;
}
