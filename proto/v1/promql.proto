// PromQL push-down: the shard-side half of instant, range, grid (stepped
// selection and rollup) and aggregation evaluation.
//
// This is the same wire contract as the rest of `proto/v1/` — a PromQL
// push-down *is* a fanout — so it shares the package, and with it `Label`,
// `Sample` and `SeriesSelector`. It used to live at `src/promql/types.proto`
// with its own package and its own copies of those three; the copies drifted
// (`Sample` had its two field numbers the other way round) and the selector was
// a strictly weaker matcher than the one in `filters.proto`, so both sides now
// share one definition.

syntax = "proto3";

package valkey_timeseries.fanout.v1;

import "v1/common.proto";
import "v1/filters.proto";

/// A single series value at a point in time.
///
/// Returned by instant (point-in-time) PromQL queries.
message InstantSample {
  /// The labels identifying this series.
  repeated Label labels = 1;
  /// The value of the sample.
  double value = 2;
  /// Timestamp in milliseconds since Unix epoch.
  int64 timestamp = 3;
  /// Optional valkey key for this sample, if any.
  string key = 4;
}

message InstantQuery {
  SeriesSelector selector = 1;
  int64 timestamp = 2;
  uint64 lookback_delta = 3;
  uint64 max_series = 4;
  uint64 max_points_per_series = 5;
}

message InstantQueryResponse {
  repeated InstantSample samples = 1;
}

/// A series with values over a time range.
///
/// Returned by range PromQL queries.
message RangeSample {
  /// The labels identifying this series.
  repeated Label labels = 1;
  /// Field 2 carried the samples as one `Sample` message each — about 18
  /// bytes per sample. They now travel as a chunk (field 4).
  reserved 2;
  /// Optional valkey key for this series, if any.
  string key = 3;
  /// The samples, as the chunk codec `TS.MRANGE` fans out with: Chimp from
  /// `WIRE_COMPRESSION_MIN_SAMPLES` up, uncompressed below it. Around 5-6
  /// bytes per sample on typical telemetry.
  SampleData data = 4;
}

message RangeQuery {
  SeriesSelector selector = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  uint64 max_series = 4;
  uint64 max_points_per_series = 5;
}

message RangeQueryResponse {
  repeated RangeSample series = 1;
}

/// A PromQL aggregation operator. Mirrors
/// `crate::promql::exec::aggregations::AggregationKind`; QUANTILE has no
/// decomposable form and is never pushed down, so it is deliberately absent.
enum AggregationKind {
  AGGREGATION_KIND_UNSPECIFIED = 0;
  AGGREGATION_KIND_SUM = 1;
  AGGREGATION_KIND_AVG = 2;
  AGGREGATION_KIND_MIN = 3;
  AGGREGATION_KIND_MAX = 4;
  AGGREGATION_KIND_COUNT = 5;
  AGGREGATION_KIND_GROUP = 6;
  AGGREGATION_KIND_STDDEV = 7;
  AGGREGATION_KIND_STDVAR = 8;
  AGGREGATION_KIND_TOPK = 9;
  AGGREGATION_KIND_BOTTOMK = 10;
  AGGREGATION_KIND_COUNT_VALUES = 11;
  AGGREGATION_KIND_LIMITK = 12;
  AGGREGATION_KIND_LIMIT_RATIO = 13;
}

/// A `by (...)` / `without (...)` modifier. An absent message means the
/// aggregation has no modifier: every sample falls into one group whose label
/// set is empty.
message AggregationGrouping {
  /// true for `without (...)`, false for `by (...)`.
  bool without = 1;
  repeated string labels = 2;
}

/// An aggregation pushed down to a shard: the instant-vector parameters that
/// select the input, plus the operator to apply to it.
message AggregationQuery {
  /// Instant-vector parameters (selector, evaluation timestamp, lookback,
  /// limits) — identical in meaning to a plain `InstantQuery`.
  InstantQuery query = 1;
  AggregationKind kind = 2;
  optional AggregationGrouping grouping = 3;
  /// Numeric operator parameter: K for topk/bottomk/limitk, the ratio for
  /// limit_ratio. Absent for the parameterless operators.
  optional double scalar_param = 4;
  /// String operator parameter: the destination label for count_values.
  optional string label_param = 5;
  /// Timestamp the aggregated output is stamped with — the query's evaluation
  /// timestamp. It differs from `query.timestamp` (which selects the input)
  /// when the selector carries an `@` or `offset` modifier.
  int64 eval_timestamp = 6;
}

/// Mergeable accumulator for one aggregation group. Field meaning depends on
/// the request's `kind`:
///   sum/avg          acc1 = Kahan running sum, acc1_compensation = its
///                    Neumaier compensation, acc2 = Welford running mean
///   min/max          acc1 = NaN-ignoring extremum
///   count/group      count only
///   stddev/stdvar    acc1 = Welford running mean, acc2 = M2,
///                    acc1_compensation = the compensation for M2
/// `count` counts every sample in the group, NaN included — the same
/// denominator the single-node aggregators use.
///
/// Deliberately distinct from `ReducePartialState` in `response.proto`, which
/// carries the same four accumulators plus a bucket timestamp for the TS.MRANGE
/// group-reduce path. The two ride different requests and evolve separately.
message AggregationPartialState {
  uint64 count = 1;
  double acc1 = 2;
  double acc2 = 3;
  double acc1_compensation = 4;
}

/// One (group, shard) partial: the group's label set as computed by the
/// request's grouping modifier, and the shard's accumulated state for it.
message AggregationGroupPartial {
  repeated Label labels = 1;
  AggregationPartialState state = 2;
}

/// A PromQL range-vector function a shard can evaluate on its own. Mirrors
/// `crate::promql::functions::RollupKind`.
///
/// Membership is by window locality, not decomposability: a function belongs
/// here when its output depends on nothing but one series' samples inside the
/// window. `absent_over_time` is permanently excluded — its answer depends on
/// series being absent across the whole cluster, which no single shard can see.
///
/// The list grows by appending. Every node in a cluster runs the same build, so
/// a shard that decodes a number it does not know has been handed a corrupt
/// request and refuses it rather than guessing.
enum RollupKind {
  ROLLUP_KIND_UNSPECIFIED = 0;
  ROLLUP_KIND_SUM_OVER_TIME = 1;
  ROLLUP_KIND_COUNT_OVER_TIME = 2;
  ROLLUP_KIND_LAST_OVER_TIME = 3;
  ROLLUP_KIND_AVG_OVER_TIME = 4;
  ROLLUP_KIND_MIN_OVER_TIME = 5;
  ROLLUP_KIND_MAX_OVER_TIME = 6;
  ROLLUP_KIND_STDDEV_OVER_TIME = 7;
  ROLLUP_KIND_STDVAR_OVER_TIME = 8;
  ROLLUP_KIND_MAD_OVER_TIME = 9;
  ROLLUP_KIND_PRESENT_OVER_TIME = 10;
  ROLLUP_KIND_FIRST_OVER_TIME = 11;
  ROLLUP_KIND_QUANTILE_OVER_TIME = 12;
  ROLLUP_KIND_TS_OF_FIRST_OVER_TIME = 13;
  ROLLUP_KIND_TS_OF_LAST_OVER_TIME = 14;
  ROLLUP_KIND_TS_OF_MIN_OVER_TIME = 15;
  ROLLUP_KIND_TS_OF_MAX_OVER_TIME = 16;
  ROLLUP_KIND_RATE = 17;
  ROLLUP_KIND_INCREASE = 18;
  ROLLUP_KIND_DELTA = 19;
  ROLLUP_KIND_IRATE = 20;
  ROLLUP_KIND_IDELTA = 21;
  ROLLUP_KIND_DERIV = 22;
  ROLLUP_KIND_RESETS = 23;
  ROLLUP_KIND_CHANGES = 24;
}

/// The range-vector function half of a grid query: `rate(m[5m])`'s `rate` and
/// `[5m]`. Its presence is what makes a grid query a rollup rather than a
/// stepped instant selection.
message GridRollup {
  RollupKind kind = 1;
  /// Window width: the `[5m]`. Each window is `(end - range_ms, end]`.
  int64 range_ms = 2;
  /// Numeric function parameter — `quantile_over_time`'s phi. Absent for the
  /// parameterless rollups.
  optional double scalar_param = 3;
}

/// An outer aggregation fused onto a grid query: the `sum by (job)` of
/// `sum by (job) (rate(m[5m]))` or of `sum by (job) (m)`. The shard groups
/// its per-series values as well as computing them, so what crosses the wire is
/// one partial per group per step rather than one value per *series* per step.
///
/// Only the reducing operators appear here; the selecting ones (topk and
/// friends) need the individual samples and are not fused.
message GridAggregation {
  AggregationKind kind = 1;
  optional AggregationGrouping grouping = 2;
  /// Numeric operator parameter: K for topk/bottomk/limitk, the ratio for
  /// limit_ratio. Absent for the parameterless operators.
  optional double scalar_param = 3;
  /// String operator parameter: the destination label for count_values.
  optional string label_param = 4;
}

/// One read of a selector over a range query's step grid, pushed down to a
/// shard: which series to read, which window ends to evaluate at, and what to
/// evaluate there.
///
/// Three shapes share this one request, told apart by the two optional
/// messages:
///
/// * neither — *stepped instant selection*: at every window end, the last
///   sample at or before it and inside the lookback window, i.e. what a range
///   query's step loop would have picked for a bare vector selector;
/// * `rollup` — the function reduced over each window;
/// * `aggregation` — either of the above, folded per `(group, step)` on the
///   shard.
///
/// Every time-dependent field is *resolved*: `@` and `offset` are applied by
/// the coordinator before the request is built, so a shard evaluates exactly
/// the window ends it is told and never re-derives a modifier.
message GridQuery {
  SeriesSelector selector = 1;
  /// The resolved step grid. `step_ms == 0` means a single evaluation, at
  /// `range_end_ms`; otherwise the windows end at every step from
  /// `query_start` through `query_end`.
  int64 query_start = 2;
  int64 query_end = 3;
  int64 step_ms = 4;
  /// Window end for the single-evaluation case, with `@` and `offset` already
  /// resolved by the coordinator.
  int64 range_end_ms = 5;
  /// The staleness window for stepped selection (and for the rollups that
  /// consult it), as the coordinator resolved it.
  uint64 lookback_delta_ms = 6;
  uint64 max_series = 7;
  /// Bound on the raw points examined per series, enforced shard-side. The
  /// coordinator separately bounds the points it accepts back.
  uint64 max_points_per_series = 8;
  optional GridRollup rollup = 9;
  optional GridAggregation aggregation = 10;
  /// Whether a stepped selection must carry each pick's own timestamp
  /// (`GridSeries.sample_lag`). Only `timestamp()` observes it; every other
  /// consumer stamps a value with its step, so the column is left out unless
  /// the query asks.
  bool sample_timestamps = 11;
}

/// One series' stepped or rolled-up output, in columns.
///
/// Both sides know the request's window ends, so a point is addressed by its
/// *index* into them rather than by its timestamp: `presence` is a bitmap over
/// the window ends (bit `i` of byte `i / 8` set when window `i` produced a
/// value), and `values` holds one entry per set bit, in index order. A 240-step
/// grid costs 30 bytes of bitmap and eight bytes per value, against the
/// twenty-odd bytes per point that a timestamped message form carried.
///
/// A window that held no eligible sample is *absent* — its bit is clear —
/// never present with a NaN value. That distinction is the result, so it has
/// to survive the wire: NaN is a legitimate rolled-up value.
message GridSeries {
  repeated Label labels = 1;
  bytes presence = 2;
  repeated double values = 3;
  /// For a stepped selection asked for `sample_timestamps`: how far before its
  /// window end each pick's own timestamp lies (`step_ts - sample_ts`, never
  /// negative), one per value. Empty otherwise, and for rollup output.
  repeated int64 sample_lag = 4;
}

/// One `(group, step, shard)` partial for a fused grid query: the group's label
/// set as computed by the request's grouping modifier, the step it belongs to,
/// and the shard's accumulated state for that pair.
message GridGroupPartial {
  repeated Label labels = 1;
  int64 step_ts = 2;
  AggregationPartialState state = 3;
}

/// Each series the shard read lands in exactly one of the three lists.
///
/// Which list is decided by the request and by size. A fused request answers in
/// `partials`, everything else in `series` — except that a series whose raw span
/// is *smaller* than its grid output (`step` finer than the sample cadence)
/// travels in `raw`, and the coordinator runs the same per-series stage over it
/// that the shard would have. `series` and `partials` never both appear: a
/// response that carries per-series values for a fused request, or partials for
/// an unfused one, is from a corrupt peer.
message GridQueryResponse {
  repeated GridSeries series = 1;
  repeated GridGroupPartial partials = 2;
  repeated RangeSample raw = 3;
}

/// The labels of the series a selector matches on this node, for the
/// coordinator's derived filter push-down (a range query narrows one operand
/// of a binary operation by what the other operand's series carry). Labels
/// only: no sample is read to answer it.
message LabelProfileQuery {
  SeriesSelector selector = 1;
  /// Past this many matching series the node answers `overflow` rather than
  /// walking further; the coordinator then leaves the selector as written.
  uint64 max_series = 2;
}

/// One label over the matched series.
message LabelValueProfile {
  string name = 1;
  /// How many of the matched series carry the label.
  uint64 carried_by = 2;
  /// Its distinct values, sorted; complete unless `overflow`.
  repeated string values = 3;
  /// More distinct values exist than the coordinator would enumerate;
  /// `values` holds only the first of them.
  bool overflow = 4;
}

message LabelProfileResponse {
  /// How many series the selector matched on this node.
  uint64 series = 1;
  /// One entry per label name any of them carries, `__name__` excluded.
  repeated LabelValueProfile labels = 2;
  /// The node matched more series than `max_series`: `series` and `labels`
  /// are not filled in.
  bool overflow = 3;
}

message AggregationQueryResponse {
  /// Set for the reduction operators (sum/avg/min/max/count/group/stddev/
  /// stdvar): one mergeable partial per group the shard saw.
  repeated AggregationGroupPartial partials = 1;
  /// Set for the selection operators (topk/bottomk/limitk/limit_ratio) and
  /// count_values: the shard's locally selected/counted samples. Also carries
  /// the raw instant vector when `applied` is false.
  repeated InstantSample samples = 2;
  /// Compatibility handshake: true when the shard applied the requested
  /// aggregation. A shard that does not recognize the requested `kind` (a
  /// newer coordinator during a rolling upgrade) returns the raw instant
  /// vector in `samples` with `applied` false, and the coordinator aggregates
  /// it itself. Absent on a pre-handshake peer (proto3 decodes as false),
  /// which is exactly the right interpretation.
  bool applied = 3;
}
