# Standalone workspace: the benchmark driver never links the module crate, and its
# load-generator dependencies must not enter the shipped module (plan, "Recommended
# design"). The empty [workspace] table keeps cargo from attaching this package to
# the repository root workspace. Cargo.lock is committed on purpose.
[package]
name = "server_bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Comparative server benchmark driver: Valkey TimeSeries vs the pinned RedisTimeSeries reference"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hdrhistogram = { version = "7.5", default-features = false }
redis = { version = "1.6", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
debug = 1
