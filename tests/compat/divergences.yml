# Known-divergence registry (docs/plans/rts-compatibility-test-plan.md §5.3).
#
# The single source of truth consulted by the differential harness. A mismatch
# fully covered by an entry here is recorded as XFAIL-DIVERGENT in the conformance
# report; an uncovered mismatch fails the test.
#
# Rules:
#   - every entry has an owner-reviewed rationale;
#   - `behavior`-kind entries additionally require sign-off in the PR that adds them;
#   - remove entries that stop firing (stale entries mean we probably fixed the
#     divergence — delete the entry so a regression is caught).
#
# Fields: id, command, kind, description, rationale, since, details_regex (optional —
# scopes the entry to deltas whose detail string matches; without it the entry covers
# every delta of the given kind on the given command), documentation_only (optional —
# the harness never matches the entry; it documents a divergence that a test pins with
# explicit per-engine assertions).
#
# ⚠️ An unscoped `behavior` entry covers every value/shape/error-condition delta on its
# command — i.e. nearly every real bug on that command. Always add a details_regex, or
# documentation_only, so an entry can not silently absorb an unrelated mismatch.
#
# Kinds: reply-superset | error-text | float-format | behavior | config-name | unsupported
#
# Phase-1 triage suspects: all resolved.
#   - config naming (ts-chunk-size, ts-ignore-max-value-diff): fixed 2026-07-16 —
#     renamed to the RTS names (ts-chunk-size-bytes, ts-ignore-max-val-diff);
#     the module-name prefix that valkey 8.0 forces on every module config is
#     DIV-0008 below. Full parity coverage in tests/compat/test_compat_config.py.
#   - TS.INFO labels nil vs empty-array: fixed (findings doc #5).

- id: DIV-0001
  command: TS.INFO
  kind: reply-superset
  description: >
    TS.INFO returns additional fields (metric, encoding, rounding) beyond the
    RedisTimeSeries 8.10 field set.
  rationale: extension metadata; extra fields are additive and invisible to
    map-parsing clients
  since: 0.1.0
  details_regex: '^\$\.(metric|encoding|rounding)\b'

# DIV-0002..DIV-0007 and DIV-0052..DIV-0053 share one root cause (findings doc #13): sample values are
# replied via RedisModule_ReplyWithDouble, so the RESP2 bulk-string text comes
# from valkey-core's fpconv/d2string formatter ("0.5", "1e+100"), while RTS
# formats with its own internal method ("5E-1", "1E100"). The parsed values are
# bit-identical; RESP3 is unaffected (clients compare parsed doubles). Reviewed
# decision: keep the valkey-native ValkeyValue::Float path. One entry per
# one entry per sample-returning command because registry matching is per-command; delete the 
# batch together if the decision is ever reversed.
- id: DIV-0002
  command: TS.RANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation (e.g. 0.5 vs 5E-1); values parse identically.
  rationale: sample values are replied with ValkeyValue::Float
    (RedisModule_ReplyWithDouble); RESP2 text is owned by valkey-core, and
    matching RTS byte-for-byte would be impractical
  since: 0.1.0

- id: DIV-0003
  command: TS.REVRANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0004
  command: TS.GET
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0005
  command: TS.MGET
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0006
  command: TS.MRANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0007
  command: TS.MREVRANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
