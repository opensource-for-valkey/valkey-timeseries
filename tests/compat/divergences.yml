# Known-divergence registry (docs/rts-compatibility-test-plan.md §5.3).
#
# The single source of truth consulted by the differential harness. A mismatch
# fully covered by an entry here is recorded as XFAIL-DIVERGENT in the conformance
# report; an uncovered mismatch fails the test.
#
# Rules:
#   - every entry has an owner-reviewed rationale;
#   - `behavior`-kind entries additionally require sign-off in the PR that adds them;
#   - remove entries that stop firing (stale entries mean we probably fixed the
#     divergence — delete the entry so a regression is caught).
#
# Fields: id, command, kind, description, rationale, since, details_regex (optional —
# scopes the entry to deltas whose detail string matches; without it the entry covers
# every delta of the given kind on the given command), documentation_only (optional —
# the harness never matches the entry; it documents a divergence that a test pins with
# explicit per-engine assertions).
#
# ⚠️ An unscoped `behavior` entry covers every value/shape/error-condition delta on its
# command — i.e. nearly every real bug on that command. Always add a details_regex, or
# documentation_only, so an entry can not silently absorb an unrelated mismatch.
#
# Kinds: reply-superset | error-text | float-format | behavior | config-name | unsupported
#
# Phase-1 triage suspects: all resolved.
#   - config naming (ts-chunk-size, ts-ignore-max-value-diff): fixed 2026-07-16 —
#     renamed to the RTS names (ts-chunk-size-bytes, ts-ignore-max-val-diff);
#     the module-name prefix that valkey 8.0 forces on every module config is
#     DIV-0008 below. Full parity coverage in tests/compat/test_compat_config.py.
#   - TS.INFO labels nil vs empty-array: fixed (findings doc #5).

- id: DIV-0001
  command: TS.INFO
  kind: reply-superset
  description: >
    TS.INFO returns additional fields (metric, encoding, rounding) beyond the
    RedisTimeSeries 8.6 field set.
  rationale: extension metadata; extra fields are additive and invisible to
    map-parsing clients
  since: 0.1.0
  details_regex: '^\$\.(metric|encoding|rounding)\b'

# DIV-0002..DIV-0007 share one root cause (findings doc #13): sample values are
# replied via RedisModule_ReplyWithDouble, so the RESP2 bulk-string text comes
# from valkey-core's fpconv/d2string formatter ("0.5", "1e+100"), while RTS
# formats with its own internal method ("5E-1", "1E100"). The parsed values are
# bit-identical; RESP3 is unaffected (clients compare parsed doubles). Reviewed
# decision: keep the valkey-native ValkeyValue::Float path. One entry per
# one entry per sample-returning command because registry matching is per-command; delete the 
# batch together if the decision is ever reversed.
- id: DIV-0002
  command: TS.RANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation (e.g. 0.5 vs 5E-1); values parse identically.
  rationale: sample values are replied with ValkeyValue::Float
    (RedisModule_ReplyWithDouble); RESP2 text is owned by valkey-core, and
    matching RTS byte-for-byte would be impractical
  since: 0.1.0

- id: DIV-0003
  command: TS.REVRANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0004
  command: TS.GET
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0005
  command: TS.MGET
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0006
  command: TS.MRANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0007
  command: TS.MREVRANGE
  kind: float-format
  description: >
    RESP2 sample-value text uses valkey-core's double formatting instead of
    RTS's notation; values parse identically (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0008
  command: CONFIG
  kind: config-name
  description: >
    Every module config is reachable only under the module-name namespace:
    RTS `ts-chunk-size-bytes` is our `ts.ts-chunk-size-bytes`, and likewise
    for the whole ts-* surface. The unprefixed suffix matches RTS exactly.
  rationale: valkey 8.0's module-config API always registers configs as
    "<module>.<name>" and offers no unprefixed registration (the RTS names are
    possible on Redis 8 only via its CONFIG_UNPREFIXED module flag); revisit
    when the minimum supported valkey version gains unprefixed module configs
  since: 0.1.0

- id: DIV-0009
  command: CONFIG
  kind: behavior
  description: >
    `ts-num-threads` defaults to 4; RTS 8.6 defaults to 3. Name, range,
    immutability, and semantics (query worker pool size) are unchanged —
    only the out-of-the-box value differs.
  rationale: sizes our rayon pool for parallel query processing; 4 is the
    deliberate default for this engine and the config remains settable at
    startup for anyone wanting RTS's value
  since: 0.1.0

- id: DIV-0010
  command: RESTORE
  kind: unsupported
  description: >
    RTS-produced RDB files and DUMP payloads cannot be loaded (and ours
    cannot be loaded by RTS). Both modules register the module type name
    TSDB-TYPE with incompatible payload formats (ours encver 1, RTS 8.6
    encver 9); every load path fails cleanly by design — RESTORE errors
    without creating a key, an RTS RDB file is refused at startup with a
    clear log message, and the module's encoding-version guard rejects any
    foreign TSDB-TYPE payload that passes the server's RDB-version check.
  rationale: owner decision 2026-07-16 — RTS->valkey RDB migration is
    explicitly not a roadmap item; the formats are incompatible and no
    conversion tooling is planned. Migration is by re-ingest (TS.RANGE
    export -> TS.MADD, or live dual-write); see COMPATIBILITY.md
    "Persistence and on-disk format". Defined-failure behavior pinned by
    tests/compat/test_compat_persistence.py
  since: 0.1.0

- id: DIV-0012
  command: TS.RANGE
  kind: unsupported
  description: >
    The `twa` (time-weighted average) aggregator is not implemented. RTS 8.6
    computes a time-weighted average over the bucket; we reject the aggregator
    name with "TSDB: unknown aggregation type" on every command that takes an
    AGGREGATION token (TS.RANGE/TS.REVRANGE/TS.MRANGE/TS.MREVRANGE and
    TS.CREATERULE), and `twa` compaction policies are likewise unavailable.
  rationale: >
    owner decision 2026-07-16 (Phase 2 triage) — a feature gap rather than a
    deliberate divergence, deferred to its own task because matching RTS's
    bucket-edge interpolation semantics needs a design pass and its own
    black-box probing. Rejecting cleanly is the safe interim behavior — a
    client gets a detectable error instead of a differently-computed number.
    Pinned by TestAggregation::test_unsupported_aggregator_is_rejected_not_wrong;
    delete this entry and tests/compat/compat_helpers.py's
    UNSUPPORTED_AGGREGATORS when twa lands.
  since: 0.1.0

# DIV-0013..DIV-0016 are Phase 2 read-path findings. All four are pinned by
# per-engine assertions in tests/compat/test_compat_range.py rather than by
# registry matching: an accepted-input superset is non-registrable by design
# (§5.2), and the over-strict/behavior cases can only be matched by a regex
# broad enough to mask real regressions in the same delta class. They are
# recorded here because this file is what the public compatibility page renders.
#
# ⚠️ All four are `behavior`-kind and therefore need owner sign-off in the PR
# that introduces them (§5.3).

- id: DIV-0013
  command: TS.RANGE
  kind: behavior
  documentation_only: true
  description: >
    The range-bound grammar accepts two forms RTS 8.6 rejects with
    "wrong fromTimestamp": `*` (the current time) and unit-suffixed relative
    offsets (`-1h`, `-30m`, `-2d`). This is an accepted-input superset — a
    query valid here errors on RedisTimeSeries. A *bare* negative integer is
    NOT part of the extension: it is an absolute timestamp and is rejected the
    same way RTS rejects it (previously it was silently read as an offset).
  rationale: >
    Accepted (owner sign-off 2026-07-17, §5.3): a deliberate extension for
    developer ergonomics — `*` and unit-suffixed relative offsets make ad-hoc
    queries far easier to write by hand. Kept because it is purely additive and
    unambiguous once bare negatives are excluded: every query RTS accepts still
    means the same thing here, so the extension only widens the accepted input.
    Being a superset, it can not be matched by the registry (§5.2 hard-fails
    "reference errors, subject succeeds") and is pinned per-engine by
    TestOptionParsing::test_relative_and_now_bounds_are_an_accepted_input_superset.
    Note the direction of risk: code written against this extension will not run
    on RedisTimeSeries, so it is a portability caveat for users, not a
    compatibility break for clients arriving from RTS.
  since: 0.1.0

- id: DIV-0014
  command: TS.RANGE
  kind: behavior
  documentation_only: true
  description: >
    A repeated option (e.g. `COUNT 5 COUNT 2`) is accepted by both engines but
    resolved differently: RTS 8.6 keeps the first occurrence, we keep the last.
    Neither errors.
  rationale: >
    Accepted (owner sign-off 2026-07-17, §5.3): keep our last-occurrence-wins
    resolution as the default. Pinned by TestOptionParsing::test_duplicated_option.
    Gated (2026-07-18): this is the archetype of the class `ts-compatibility-mode`
    exists for — both engines accept the input, neither errors, and the answers
    differ silently — so `strict` now resolves first-occurrence-wins the way RTS
    does, on TS.RANGE/REVRANGE/MRANGE/MREVRANGE. The earlier "for no observable
    benefit" reading undervalued that: a client migrating from RTS with a
    duplicated option (a query builder appending twice) gets different data with
    no error to alert it. The cost estimate was accurate — the implementation is
    the seen-token tracking described here (RepeatedOptions in command_parser.rs),
    which still parses the duplicate's operands so a malformed operand errors in
    both modes. The default is unchanged; only the opt-in is new.
  since: 0.1.0

- id: DIV-0015
  command: TS.RANGE
  kind: behavior
  documentation_only: true
  description: >
    We reject unknown or inapplicable trailing tokens; RTS 8.6 silently ignores
    them. `TS.RANGE k - + GARBAGE` returns samples on RTS and errors here, as do
    `WITHLABELS` (not a TS.RANGE option) and `EMPTY`/`BUCKETTIMESTAMP` without
    an accompanying AGGREGATION. ALIGN without AGGREGATION is the exception RTS
    does validate, and both engines reject it.
  rationale: >
    Accepted (owner sign-off 2026-07-17, §5.3): deliberately stricter than the
    reference. Matching would mean accepting arbitrary garbage in the option list
    and silently ignoring a mistyped option, turning a user's typo into a wrong
    answer instead of an error. Strictness is the safer divergence, and it is the
    one direction that cannot corrupt a result: the cost is that a client relying
    on RTS ignoring a stray token sees an error here, which is a visible, fixable
    failure rather than silently wrong data. Pinned by
    TestOptionParsing::test_unknown_or_inapplicable_option_rejected.
  since: 0.1.0

- id: DIV-0016
  command: TS.REVRANGE
  kind: behavior
  documentation_only: true
  description: >
    Under `AGGREGATION first|last ... EMPTY`, a gap bucket's carried-forward
    fill follows the wrong direction on TS.REVRANGE. RTS fills a gap with the
    previously *emitted* bucket's value, so its reverse scan carries the
    chronologically newer neighbour (`last` fills with the newer value,
    `first` fills NaN); we aggregate forward and reverse the finished buckets,
    so our carry stays chronological and the two come out swapped. Bucket
    timestamps and counts match; only the gap fill differs. TS.RANGE (forward)
    is byte-identical, as are non-EMPTY reverse queries — `first`/`last`
    themselves were aligned to RTS's scan-order semantics
    (AggregationOptions::for_scan_order).
  rationale: >
    owner decision pending — matching would require either feeding the
    aggregator reverse-ordered samples (buffering every sample in range rather
    than one value per bucket, the memory trade the forward design exists to
    avoid) or a fill pass over the reversed output. Narrow cell: reverse +
    EMPTY + first/last only. Pinned by
    TestEmpty::test_empty_carry_forward_is_chronological_not_scan_order.
  since: 0.1.0

- id: DIV-0017
  command: TS.CREATERULE
  kind: behavior
  documentation_only: true
  description: >
    A compaction destination may itself be the source of another rule. RTS 8.6
    refuses ("TSDB: the source key already has a source rule"), making a
    destination a leaf; we accept the chain, so a downstream series can compact
    into a third. Accepted-input superset — a TS.CREATERULE valid here errors on
    RedisTimeSeries.
  rationale: >
    owner decision pending — chaining is a coherent extension (cascading
    rollups), but it is a real behavioral superset and the circular-dependency
    guard (check_new_rule_circular_dependency) is what keeps it safe. Confirm
    the intent, or reject chains to match. Pinned by
    TestRuleLifecycle::test_rule_on_rule_is_an_accepted_input_superset.
  since: 0.1.0

- id: DIV-0018
  command: CONFIG
  kind: behavior
  documentation_only: true
  description: >
    `ts-encoding` is a one-way latch on RTS 8.6: CONFIG SET can move it away
    from the default `compressed` (e.g. to `uncompressed`) but never back —
    the set returns OK yet the value stays put. Ours is fully reversible. The
    default (compressed) matches; only runtime mutability diverges. Because the
    latch is irreversible and the reference container is shared, no fixture can
    restore it, so the value-validation test exercises the encoding grammar on
    the subject and leaves the reference pristine, and the defaults test
    tolerates a latched reference value.
  rationale: >
    owner decision pending — observed RTS behavior, not something we chose;
    matching it would mean making ts-encoding immutable-after-change, which is
    strictly less useful. Pinned by
    TestValueValidation::test_encoding_is_a_one_way_latch_on_reference.
  since: 0.1.0

# DIV-0019/DIV-0020 are the Prometheus-style FILTER extensions: our label-filter
# grammar is a superset of RTS's, so a few filters valid here are rejected by
# RTS. Both are accepted-input supersets (§5.2, non-registrable) pinned by
# per-engine assertions in test_compat_mrange.py; they apply equally to
# TS.MGET and TS.QUERYINDEX. behavior-kind → owner sign-off required.

- id: DIV-0019
  command: TS.MRANGE
  kind: behavior
  documentation_only: true
  description: >
    A FILTER with no positive (intersecting) matcher — only negations
    (`metric!=cpu`) or absence matchers (`region=`) — selects the complement.
    RTS requires at least one equality matcher and rejects such a filter with
    "please provide at least one matcher" (which is our MISSING_FILTER text, so
    parity is enforceable if desired). Applies to TS.MRANGE/MGET/QUERYINDEX.
  rationale: >
    owner decision pending — our FILTER language is deliberately Prometheus-
    style (the shared parser also backs the TS.MDEL/TS.CARD extensions), so a
    complement query is a feature here. Restricting it to the in-scope commands
    for RTS parity is a scoped change to the command parse layer, not the
    shared selector parser. Pinned by
    TestFilterLanguage::test_negative_only_matcher_is_a_superset.
  since: 0.1.0

- id: DIV-0020
  command: TS.MRANGE
  kind: behavior
  documentation_only: true
  description: >
    A bare token with no operator (`not-a-matcher`) is accepted as a Prometheus
    metric-name selector (matching nothing when no such metric exists); RTS
    rejects it with "failed parsing labels". Same extended-grammar root as
    DIV-0019; applies to TS.MRANGE/MGET/QUERYINDEX.
  rationale: >
    owner decision pending — bare metric-name selectors are valid PromQL and a
    deliberate extension. Pinned by
    TestFilterLanguage::test_bare_metric_name_matcher_is_a_superset.
  since: 0.1.0

# DIV-0021 is a Tier C (differential fuzzer) finding. Like DIV-0013..DIV-0020 it is
# `documentation_only` and pinned by explicit per-engine assertions
# (tests/compat/test_compat_del.py): the only registry regex that could match it
# ("reference=<n> subject=0" on TS.DEL) would also absorb a genuine "TS.DEL deletes
# nothing" regression — the exact hazard §5.3 warns about.
#
# ⚠️ `behavior`-kind: needs owner sign-off in the PR that introduces it (§5.3).

- id: DIV-0021
  command: TS.DEL
  kind: behavior
  documentation_only: true
  description: >
    TS.DEL over a range covering only already-expired samples reports 0 where RTS
    reports the number of expired-but-still-stored samples it removed. Root cause is
    a retention-model difference, not a TS.DEL bug: RTS trims lazily (an out-of-window
    sample stays physically stored until its chunk expires) and filters it out of every
    read path, so TS.DEL can still find and count it; we trim eagerly on write, so the
    sample is already gone. Every read path agrees on both engines — TS.RANGE hides the
    sample and TS.INFO reports totalSamples/firstTimestamp over the retained window —
    so the divergence is confined to the TS.DEL return value for samples a client can
    not observe anyway.
  rationale: >
    owner decision pending — matching RTS exactly means adopting its lazy-trim model
    (physical retention deferred, every read path filtering logically), which is the
    architecture the eager trim deliberately replaced to make TS.INFO's totalSamples /
    firstTimestamp agree with TS.RANGE (see the plan's "retention accounting" fix).
    Reverting that is a much larger change than the observable delta justifies, so the
    divergence is documented rather than chased. Pinned by
    TestDelRetention::test_del_of_expired_range_counts_differently.
  since: 0.1.0

# DIV-0022 is a Tier C (differential fuzzer) finding, pinned per-engine in
# tests/compat/test_compat_range.py rather than matched by regex: the only regex that
# could match it ("reference='NaN' subject=<n>") would absorb any real aggregation bug
# that returns a number where RTS returns NaN.
#
# ⚠️ `behavior`-kind: needs owner sign-off in the PR that introduces it (§5.3).

- id: DIV-0022
  command: TS.RANGE
  kind: behavior
  documentation_only: true
  description: >
    The variance/stddev aggregators (std.p, std.s, var.p, var.s) return NaN on RTS when
    any sample magnitude exceeds sqrt(DBL_MAX) (~1.34e154); we return the mathematically
    correct value. RTS accumulates the naive sum of squares, so x^2 overflows to +Inf and
    the Inf - Inf term yields NaN — e.g. std.p over the single sample 1.7976931348623157e308
    is NaN on RTS and 0 for us (a single sample has zero variance). The boundary is exact:
    1e150 (square 1e300, finite) agrees on both engines; 1e200 (square overflows) diverges.
    Only this aggregator family is affected — avg/sum/min/max agree at DBL_MAX.
  rationale: >
    Accepted (owner sign-off 2026-07-17, §5.3): our implementation is correct and stands.
    Matching RTS would mean adopting a numerically unstable accumulation purely to
    reproduce a floating-point overflow artifact, degrading a correct result (a single
    sample has zero variance) into NaN. This divergence can only ever turn an RTS NaN into
    a usable number, never the reverse, so no client is broken by it.
    Pinned by TestAggregationOverflow::test_variance_family_overflows_on_rts, whose
    companion test_below_the_overflow_boundary_agrees keeps the sub-boundary values (where
    both engines must agree exactly) from being masked by this entry.
    Consequence for Tier C: the fuzzer caps generated magnitudes below the overflow
    boundary (fuzz_strategies.VALUES) so the variance aggregators stay fuzzable; that cap
    is now permanent rather than provisional, and DBL_MAX itself stays covered by the
    pinning test and corpus/float_formatting_high_precision.json.
  since: 0.1.0

# DIV-0023 is a Tier C (differential fuzzer) finding, pinned per-engine in
# tests/compat/test_compat_compaction.py. Not registry-matchable: the regex would have to
# cover "reference=<ts> subject=<ts>" on TS.GET/TS.MGET, absorbing any real last-sample bug.
#
# ⚠️ `behavior`-kind: needs owner sign-off in the PR that introduces it (§5.3).

- id: DIV-0023
  command: TS.GET
  kind: behavior
  documentation_only: true
  description: >
    After an out-of-order write back-fills a compaction bucket *older* than the currently
    open one, TS.GET / TS.MGET without LATEST report the newly materialized downstream
    bucket for us, but the previous (stale) bucket on RTS. Both engines store identical
    downstream data — TS.RANGE returns the same samples on each, and TS.GET ... LATEST
    agrees too — so RTS's reply contradicts its own TS.RANGE: it does not advance the
    destination's cached last-sample when an older bucket is filled in. Reproducer: rule
    `AGGREGATION avg 500` on src; `TS.ADD src 0 0`, `TS.ADD src 1000 0` (closes bucket 0),
    then `TS.ADD src 500 0` — RANGE is `[[0,0],[500,0]]` on both, but TS.GET is `[500,0]`
    for us and `[0,0]` on RTS.
  rationale: >
    Default unchanged: `extended` reports the last sample the series actually holds,
    rather than reproducing an inconsistency between RTS's own TS.GET and TS.RANGE.
    Gated (2026-07-18): both engines accept the input and neither errors, so this is
    the class `ts-compatibility-mode` exists for — `strict` now reports RTS's cached
    destination last-sample from TS.GET/TS.MGET. The state is a runtime-only marker
    (TimeSeries::last_forward_close) recorded when forward progress closes a bucket;
    back-filling an older bucket deliberately leaves it alone. LATEST and the stored
    downstream data are untouched in either mode.
    Known limitation of the gate: the marker is not persisted, so after a reload or
    restart a destination with a pending back-fill reports its true last sample again
    until the next forward close. Matching RTS there would mean persisting a value
    that contradicts the series' own chunk data, which needs an RDB encoding-version
    bump (loader refuses any encver but 1); deliberately out of scope for the gate.
    Pinned by TestOutOfOrderBackfill::test_get_after_backfilling_an_older_bucket
    (extended) and ::test_strict_mode_reports_the_stale_bucket_like_rts plus
    ::test_strict_mode_advances_on_the_next_forward_close (strict).
  since: 0.1.0
