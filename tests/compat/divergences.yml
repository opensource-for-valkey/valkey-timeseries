  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0052
  command: TS.NRANGE
  kind: float-format
  description: >
    RESP2 pivoted-row value text uses valkey-core's double formatting instead of
    RTS's notation (e.g. 0.1 vs 1E-1, nan vs NaN); values parse identically
    (same cause as DIV-0002).
  rationale: same root cause as DIV-0002
  since: 0.1.0

- id: DIV-0053
  command: TS.NREVRANGE
  kind: float-format
  description: >
    RESP2 pivoted-row value text uses valkey-core's double formatting instead of
