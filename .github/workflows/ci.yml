name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  VALKEY_REPO_URL: https://github.com/valkey-io/valkey.git
  TEST_FRAMEWORK_REPO: https://github.com/valkey-io/valkey-test-framework
  TEST_FRAMEWORK_DIR: tests/valkeytestframework

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server_version: ["unstable", "8.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protobuf contracts
        run: buf lint

      - name: Set the server version for python integration tests
        run: echo "SERVER_VERSION=${{ matrix.server_version }}" >> $GITHUB_ENV

      - name: Run cargo and clippy format check
        run: |
          cargo fmt --check
          cargo clippy --profile release --all-targets -- -D clippy::all

      - name: Release Build
        run: RUSTFLAGS="-D warnings" cargo build --all --all-targets --release

      - name: Run unit tests
        run: cargo test --features enable-system-alloc

      - name: Make valkey-server binary
        run: |
          mkdir -p "tests/build/binaries/${{ matrix.server_version }}"
          cd tests/build
          git clone "${{ env.VALKEY_REPO_URL }}"
          cd valkey
          git checkout ${{ matrix.server_version }}
          make -j
          cp src/valkey-server ../binaries/${{ matrix.server_version }}/

      - name: Set up test framework
        run: |
          echo "Cloning test framework..."
          git clone ${{ env.TEST_FRAMEWORK_REPO }}
          mkdir -p ${{ env.TEST_FRAMEWORK_DIR }}
          mv valkey-test-framework/src/* ${{ env.TEST_FRAMEWORK_DIR }}/
          rm -rf valkey-test-framework

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update module path
        run: echo "MODULE_PATH=$(realpath target/release/libvalkey_timeseries.so)" >> $GITHUB_ENV

      # tests/compat needs a live RedisTimeSeries reference server; it is covered
      # by the compat-smoke job below.
      - name: Run integration tests
        run: python3 -m pytest --cache-clear -v "tests/" --ignore=tests/compat

  # RedisTimeSeries compatibility smoke gate (docs/rts-compatibility-test-plan.md §8):
  # Tier A smoke subset diffed against the pinned redis:8.8 reference image,
  # RESP3 only, single subject server version.
  compat-smoke:
    runs-on: ubuntu-latest
    # Non-blocking until the first-run divergences are triaged
    # (docs/rts-compat-first-run-findings.md); flip to blocking as the
    # Phase 1 exit action.
    continue-on-error: true
    env:
      SERVER_VERSION: "8.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Release Build
        run: RUSTFLAGS="-D warnings" cargo build --all --all-targets --release

      - name: Make valkey-server binary
        run: |
          mkdir -p "tests/build/binaries/${SERVER_VERSION}"
          cd tests/build
          git clone "${{ env.VALKEY_REPO_URL }}"
          cd valkey
          git checkout ${SERVER_VERSION}
          make -j
          cp src/valkey-server ../binaries/${SERVER_VERSION}/

      - name: Set up test framework
        run: |
          git clone ${{ env.TEST_FRAMEWORK_REPO }}
          mkdir -p ${{ env.TEST_FRAMEWORK_DIR }}
          mv valkey-test-framework/src/* ${{ env.TEST_FRAMEWORK_DIR }}/
          rm -rf valkey-test-framework

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update module path
        run: echo "MODULE_PATH=$(realpath target/release/libvalkey_timeseries.so)" >> $GITHUB_ENV

      - name: Start reference server (pinned redis:8.8)
        run: docker compose -f docker-compose.compat.yml up -d --wait reference

      - name: Run compatibility smoke tests
        env:
          COMPAT_REFERENCE_URL: redis://127.0.0.1:16379
        run: python3 -m pytest --cache-clear -v tests/compat -k resp3

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: test-data/compat-report.json
          if-no-files-found: ignore

  build-macos-latest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Run cargo and clippy format check
        run: |
          cargo fmt --check
          cargo clippy --profile release --all-targets -- -D clippy::all

      - name: Release Build
        run: RUSTFLAGS="-D warnings" cargo build --all --all-targets --release

      - name: Run unit tests
        run: cargo test --features enable-system-alloc

  asan-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server_version: ["unstable", "8.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Set the server version for python integration tests
        run: echo "SERVER_VERSION=${{ matrix.server_version }}" >> $GITHUB_ENV

      - name: Run cargo and clippy format check
        run: |
          cargo fmt --check
          cargo clippy --profile release --all-targets -- -D clippy::all

      - name: Release Build
        run: RUSTFLAGS="-D warnings" cargo build --all --all-targets --release

      - name: Run unit tests
        run: cargo test --features enable-system-alloc

      - name: Make Valkey-server binary with asan
        run: |
          mkdir -p "tests/build/binaries/${{ matrix.server_version }}"
          cd tests/build
          git clone "${{ env.VALKEY_REPO_URL }}"
          cd valkey
          git checkout ${{ matrix.server_version }}
          make distclean
          make -j SANITIZER=address SERVER_CFLAGS='-Werror' BUILD_TLS=module
          cp src/valkey-server ../binaries/${{ matrix.server_version }}/

      - name: Set up test framework
        run: |
          echo "Cloning test framework..."
          git clone ${{ env.TEST_FRAMEWORK_REPO }}
          mkdir -p ${{ env.TEST_FRAMEWORK_DIR }}
          mv valkey-test-framework/src/* ${{ env.TEST_FRAMEWORK_DIR }}/
          rm -rf valkey-test-framework

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update module path
        run: echo "MODULE_PATH=$(realpath target/release/libvalkey_timeseries.so)" >> $GITHUB_ENV

      # tests/compat needs a live RedisTimeSeries reference server; it is covered
      # by the compat-smoke job above.
      - name: Run integration tests
        run: |
          python3 -m pytest --capture=sys --cache-clear -v "tests/" --ignore=tests/compat -m "not skip_for_asan" 2>&1 | tee test_output.tmp
          if grep -q "LeakSanitizer: detected memory leaks" test_output.tmp; then
            RED='\033[0;31m'
            echo -e "${RED}Memory leaks detected in the following tests:"
            LEAKING_TESTS=$(grep -B 2 "LeakSanitizer: detected memory leaks" test_output.tmp | \
              grep -v "LeakSanitizer" | \
              grep ".*\.py::")
            LEAK_COUNT=$(echo "$LEAKING_TESTS" | wc -l)        
            echo "$LEAKING_TESTS" | while read -r line; do
              echo "::error::Test with leak: $line"
            done
            echo -e "\n$LEAK_COUNT python integration tests have leaks detected in them"
            rm test_output.tmp
            exit 1
          fi
          rm test_output.tmp
