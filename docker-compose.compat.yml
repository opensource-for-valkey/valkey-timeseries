# RedisTimeSeries compatibility harness — reference (and optional subject) servers.
# See docs/rts-compatibility-test-plan.md §3 (reference environment) and tests/compat/README.md.
#
# The reference image is pinned by digest and is the canonical reference artifact.
# Bumping the digest is a reviewed change and must be accompanied by a changelog scan of
# the corresponding RedisTimeSeries release notes (plan §11, "Reference drift"), recorded
# in docs/rts-reference-bumps.md. The native binary pin in tests/reference_server.sh
# (COMPAT_REFERENCE_VERSION) tracks this image and is bumped in the same change.
#
# Licensing note: the redis:8.8 image is used strictly as a black-box test target.
# Nothing from the RedisTimeSeries source repository may be vendored, copied, ported,
# or fetched at CI time (plan §3, licensing boundary).

services:
  reference:
    # redis:8.8 multi-arch index digest, resolved 2026-07-23.
    # Bundled timeseries module: 80800 (was 80602 on the previous redis:8.6 pin).
    image: redis:8.8@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    command:
      - redis-server
      - --enable-debug-command
      - "yes"
      - --notify-keyspace-events
      - KEA
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${COMPAT_REFERENCE_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Optional: run the subject (valkey-server + this module) in Docker as well.
  # Requires a Linux build of the module matching the container architecture
  # (target/release/libvalkey_timeseries.so). The pytest harness launches the subject
  # as a local process by default, so this service is opt-in:
  #   docker compose -f docker-compose.compat.yml --profile subject-docker up -d
  subject:
    image: valkey/valkey:9.1
    profiles: ["subject-docker"]
    volumes:
      - ./target/release/libvalkey_timeseries.so:/opt/module/libvalkey_timeseries.so:ro
    command:
      - valkey-server
      - --loadmodule
      - /opt/module/libvalkey_timeseries.so
      - --enable-debug-command
      - "yes"
      - --notify-keyspace-events
      - KEA
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${COMPAT_SUBJECT_PORT:-16380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "-p", "6379", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
